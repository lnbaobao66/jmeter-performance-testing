<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#2b2b2b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title Bar -->
  <rect width="1000" height="38" fill="#3c3f41"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="85" y="24" fill="#bbbbbb" font-size="12" font-weight="bold">Apache JMeter 5.6.3 — Thread Group: 02 - Load Testing Configuration</text>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <!-- Header -->
    <rect width="940" height="45" rx="4" fill="#3c3f41" stroke="#4e5254" stroke-width="0.8"/>
    <text x="20" y="28" fill="#e67e22" font-size="16" font-weight="bold">👥 Thread Group: 02 - Load Testing (50 Users - Ramp-Up 10s)</text>

    <!-- Main Config Box -->
    <rect y="60" width="940" height="300" rx="4" fill="#313335" stroke="#4e5254" stroke-width="0.8"/>
    
    <text x="24" y="90" fill="#ffffff" font-size="13" font-weight="bold">Action to be taken after a Sampler error:</text>
    <circle cx="34" cy="115" r="5" fill="#3498db"/>
    <text x="48" y="119" fill="#cccccc" font-size="12">Continue</text>
    <circle cx="140" cy="115" r="5" fill="#444444" stroke="#888888"/>
    <text x="154" y="119" fill="#888888" font-size="12">Start Next Thread Loop</text>
    <circle cx="320" cy="115" r="5" fill="#444444" stroke="#888888"/>
    <text x="334" y="119" fill="#888888" font-size="12">Stop Thread</text>
    <circle cx="440" cy="115" r="5" fill="#444444" stroke="#888888"/>
    <text x="454" y="119" fill="#888888" font-size="12">Stop Test</text>

    <!-- Thread Properties Section -->
    <text x="24" y="160" fill="#ffffff" font-size="14" font-weight="bold">Thread Properties (Thuộc tính luồng mô phỏng tải):</text>

    <!-- Number of Threads -->
    <text x="24" y="195" fill="#dddddd" font-size="12">Number of Threads (users):</text>
    <rect x="250" y="178" width="160" height="26" rx="3" fill="#2b2b2b" stroke="#3498db" stroke-width="1.2"/>
    <text x="260" y="196" fill="#2ecc71" font-size="13" font-family="monospace" font-weight="bold">50</text>
    <text x="430" y="195" fill="#888888" font-size="11">👉 50 người dùng ảo đồng thời (Concurrent Virtual Users)</text>

    <!-- Ramp-Up Period -->
    <text x="24" y="235" fill="#dddddd" font-size="12">Ramp-up period (seconds):</text>
    <rect x="250" y="218" width="160" height="26" rx="3" fill="#2b2b2b" stroke="#3498db" stroke-width="1.2"/>
    <text x="260" y="236" fill="#f1c40f" font-size="13" font-family="monospace" font-weight="bold">10</text>
    <text x="430" y="235" fill="#888888" font-size="11">👉 Thời gian tăng tải tuyến tính: 50 luồng / 10s = 5 người/giây</text>

    <!-- Loop Count -->
    <text x="24" y="275" fill="#dddddd" font-size="12">Loop Count:</text>
    <rect x="250" y="258" width="160" height="26" rx="3" fill="#2b2b2b" stroke="#3498db" stroke-width="1.2"/>
    <text x="260" y="276" fill="#3498db" font-size="13" font-family="monospace" font-weight="bold">5</text>
    <text x="430" y="275" fill="#888888" font-size="11">👉 Mỗi người dùng lặp lại hành trình đặt vé 5 lần</text>

    <!-- Same user on each iteration -->
    <rect x="24" y="305" width="14" height="14" rx="2" fill="#3498db"/>
    <text x="27" y="316" fill="#ffffff" font-size="11">✓</text>
    <text x="48" y="316" fill="#dddddd" font-size="12">Same user on each iteration (Duy trì người dùng qua các vòng lặp)</text>

    <rect x="24" y="330" width="14" height="14" rx="2" fill="#2b2b2b" stroke="#888888"/>
    <text x="48" y="341" fill="#888888" font-size="12">Specify thread lifetime (Chạy theo thời gian cố định - Duration)</text>

    <!-- Formula & Calculation Box -->
    <g transform="translate(0, 380)">
      <rect width="940" height="150" rx="4" fill="#242b35" stroke="#3498db" stroke-width="1"/>
      <text x="20" y="28" fill="#3498db" font-size="14" font-weight="bold">📊 CÔNG THỨC VÀ TÍNH TOÁN DUNG LƯỢNG TẢI (LOAD METRICS):</text>
      
      <g transform="translate(20, 50)">
        <text x="0" y="0" fill="#ffffff" font-size="12">• <tspan fill="#e67e22" font-weight="bold">Tổng số mẫu (Total Samples)</tspan> = Số Sampler (4) × Số Threads (50) × Vòng lặp (5) = <tspan fill="#2ecc71" font-weight="bold">1,000 requests</tspan></text>
        <text x="0" y="25" fill="#ffffff" font-size="12">• <tspan fill="#e67e22" font-weight="bold">Tốc độ kích hoạt luồng (Ramp-up rate)</tspan> = 50 threads / 10s = <tspan fill="#f1c40f" font-weight="bold">5 threads/giây</tspan></text>
        <text x="0" y="50" fill="#ffffff" font-size="12">• <tspan fill="#e67e22" font-weight="bold">Ý nghĩa bài toán thực tế</tspan>: Mô phỏng khung giờ cao điểm (Peak Hours) khi có đồng thời 50 hành khách truy cập tìm kiếm và mua vé trên trang BlazeDemo.</text>
      </g>
    </g>
  </g>
</svg>
