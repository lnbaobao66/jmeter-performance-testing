<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#2b2b2b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title Bar -->
  <rect width="1000" height="38" fill="#3c3f41"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="85" y="24" fill="#bbbbbb" font-size="12" font-weight="bold">Apache JMeter 5.6.3 — Graph Results: Throughput, Average &amp; Deviation Trends</text>

  <!-- Main Container -->
  <g transform="translate(20, 50)">
    <!-- Header -->
    <rect width="960" height="38" rx="3" fill="#3c3f41" stroke="#4e5254" stroke-width="0.8"/>
    <text x="16" y="24" fill="#ffffff" font-size="14" font-weight="bold">📉 Listener: Graph Results (Biểu Đồ Xu Hướng Tải &amp; Độ Trễ)</text>

    <!-- Checkboxes Legend Bar -->
    <g transform="translate(16, 50)">
      <rect width="928" height="30" rx="3" fill="#313335" stroke="#4e5254" stroke-width="0.5"/>
      
      <!-- Checkbox: Data -->
      <rect x="20" y="8" width="14" height="14" rx="2" fill="#3498db"/>
      <text x="23" y="19" fill="#ffffff" font-size="10">✓</text>
      <circle cx="48" cy="15" r="4" fill="#888888"/>
      <text x="58" y="19" fill="#cccccc" font-size="11">Data</text>

      <!-- Checkbox: Average (Blue) -->
      <rect x="120" y="8" width="14" height="14" rx="2" fill="#3498db"/>
      <text x="123" y="19" fill="#ffffff" font-size="10">✓</text>
      <circle cx="148" cy="15" r="4" fill="#3498db"/>
      <text x="158" y="19" fill="#3498db" font-size="11" font-weight="bold">Average (244 ms)</text>

      <!-- Checkbox: Median (Purple) -->
      <rect x="290" y="8" width="14" height="14" rx="2" fill="#3498db"/>
      <text x="293" y="19" fill="#ffffff" font-size="10">✓</text>
      <circle cx="318" cy="15" r="4" fill="#9b59b6"/>
      <text x="328" y="19" fill="#9b59b6" font-size="11">Median (227 ms)</text>

      <!-- Checkbox: Deviation (Red) -->
      <rect x="450" y="8" width="14" height="14" rx="2" fill="#3498db"/>
      <text x="453" y="19" fill="#ffffff" font-size="10">✓</text>
      <circle cx="478" cy="15" r="4" fill="#e74c3c"/>
      <text x="488" y="19" fill="#e74c3c" font-size="11">Deviation (48 ms)</text>

      <!-- Checkbox: Throughput (Green) -->
      <rect x="610" y="8" width="14" height="14" rx="2" fill="#3498db"/>
      <text x="613" y="19" fill="#ffffff" font-size="10">✓</text>
      <circle cx="638" cy="15" r="4" fill="#2ecc71"/>
      <text x="648" y="19" fill="#2ecc71" font-size="11" font-weight="bold">Throughput (2,568 samples/min ~ 42.8/s)</text>
    </g>

    <!-- Graph Drawing Canvas -->
    <g transform="translate(16, 90)">
      <rect width="928" height="340" rx="4" fill="#1e1e1e" stroke="#333333"/>
      
      <!-- Grid lines -->
      <line x1="0" y1="68" x2="928" y2="68" stroke="#2d2d30" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="0" y1="136" x2="928" y2="136" stroke="#2d2d30" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="0" y1="204" x2="928" y2="204" stroke="#2d2d30" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="0" y1="272" x2="928" y2="272" stroke="#2d2d30" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Y Axis Labels -->
      <text x="10" y="20" fill="#666666" font-size="10" font-family="monospace">Throughput / Latency (Max: 1000ms)</text>
      <text x="10" y="72" fill="#666666" font-size="10" font-family="monospace">750ms</text>
      <text x="10" y="140" fill="#666666" font-size="10" font-family="monospace">500ms</text>
      <text x="10" y="208" fill="#666666" font-size="10" font-family="monospace">250ms</text>
      <text x="10" y="276" fill="#666666" font-size="10" font-family="monospace">0ms</text>

      <!-- Deviation Line (Red - very stable and low at y ~ 310) -->
      <path d="M 50,315 Q 150,318 250,314 T 450,315 T 650,312 T 850,314 L 910,315" fill="none" stroke="#e74c3c" stroke-width="1.8"/>

      <!-- Average Line (Blue - ~244ms at y ~ 235) -->
      <path d="M 50,250 Q 120,240 200,238 T 350,235 T 500,234 T 650,236 T 800,235 L 910,235" fill="none" stroke="#3498db" stroke-width="2.5"/>

      <!-- Throughput Curve (Green - ramps up quickly and plateaus at top y ~ 95) -->
      <path d="M 50,320 C 100,280 150,140 250,105 C 350,98 500,92 650,95 C 750,94 850,96 910,95" fill="none" stroke="#2ecc71" stroke-width="3"/>
      
      <!-- Dots on curves -->
      <circle cx="250" cy="105" r="4" fill="#2ecc71"/>
      <circle cx="500" cy="92" r="4" fill="#2ecc71"/>
      <circle cx="750" cy="94" r="4" fill="#2ecc71"/>
      <circle cx="910" cy="95" r="4" fill="#2ecc71"/>

      <!-- Data sample scatter points (simulating individual requests) -->
      <g fill="#888888" opacity="0.6">
        <circle cx="80" cy="245" r="2"/><circle cx="120" cy="235" r="2"/><circle cx="160" cy="260" r="2"/>
        <circle cx="210" cy="220" r="2"/><circle cx="270" cy="240" r="2"/><circle cx="320" cy="250" r="2"/>
        <circle cx="380" cy="230" r="2"/><circle cx="430" cy="225" r="2"/><circle cx="490" cy="245" r="2"/>
        <circle cx="540" cy="235" r="2"/><circle cx="610" cy="255" r="2"/><circle cx="670" cy="220" r="2"/>
        <circle cx="730" cy="240" r="2"/><circle cx="790" cy="235" r="2"/><circle cx="850" cy="245" r="2"/>
      </g>
    </g>

    <!-- Bottom Metric Readouts Bar -->
    <g transform="translate(16, 440)">
      <rect width="928" height="95" rx="4" fill="#313335" stroke="#4e5254" stroke-width="0.8"/>
      <g transform="translate(20, 25)">
        <text x="0" y="0" fill="#aaaaaa" font-size="11">No of Samples: <tspan fill="#ffffff" font-weight="bold">1,000</tspan></text>
        <text x="180" y="0" fill="#aaaaaa" font-size="11">Latest sample: <tspan fill="#2ecc71" font-weight="bold">210 ms</tspan></text>
        <text x="360" y="0" fill="#aaaaaa" font-size="11">Average: <tspan fill="#3498db" font-weight="bold">244 ms</tspan></text>
        <text x="520" y="0" fill="#aaaaaa" font-size="11">Deviation: <tspan fill="#e74c3c" font-weight="bold">48 ms</tspan></text>
        <text x="680" y="0" fill="#aaaaaa" font-size="11">Throughput: <tspan fill="#2ecc71" font-weight="bold">42.8 / sec</tspan></text>

        <text x="0" y="35" fill="#2ecc71" font-size="12" font-weight="bold">💡 Nhận xét kỹ thuật:</text>
        <text x="0" y="55" fill="#cccccc" font-size="11">Đường Throughput (xanh lá) nhanh chóng đạt đỉnh và giữ ổn định ở mức ~43 req/s. Độ lệch chuẩn Deviation (đỏ) rất thấp (&lt; 50ms) chứng minh server xử lý cực kỳ đều đặn, không có hiện tượng giật lag hay treo luồng.</text>
      </g>
    </g>
  </g>
</svg>
