<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#2b2b2b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title Bar -->
  <rect width="1000" height="38" fill="#3c3f41"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="85" y="24" fill="#bbbbbb" font-size="12" font-weight="bold">Apache JMeter 5.6.3 — Aggregate Report: Key Performance Metrics &amp; Benchmarks</text>

  <!-- Main Container -->
  <g transform="translate(20, 50)">
    <!-- Header Summary Bar -->
    <rect width="960" height="70" rx="4" fill="#313335" stroke="#4e5254" stroke-width="0.8"/>
    <text x="16" y="28" fill="#e67e22" font-size="16" font-weight="bold">📋 Listener: Aggregate Report (Báo Cáo Tổng Hợp Chỉ Số Hiệu Năng)</text>
    <text x="16" y="52" fill="#aaaaaa" font-size="11">Total Samples: <tspan fill="#ffffff" font-weight="bold">1,000</tspan>  |  Throughput: <tspan fill="#2ecc71" font-weight="bold">42.8 requests/sec</tspan>  |  Avg Response: <tspan fill="#2ecc71" font-weight="bold">244 ms</tspan>  |  Error Rate: <tspan fill="#2ecc71" font-weight="bold">0.00%</tspan></text>

    <!-- Aggregate Table -->
    <g transform="translate(0, 85)">
      <!-- Table Header -->
      <rect width="960" height="32" fill="#3c3f41"/>
      <text x="12" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">LABEL</text>
      <text x="210" y="21" fill="#aaaaaa" font-size="11" font-weight="bold"># SAMPLES</text>
      <text x="290" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">AVERAGE</text>
      <text x="365" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">MEDIAN</text>
      <text x="435" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">90% LINE</text>
      <text x="505" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">95% LINE</text>
      <text x="575" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">99% LINE</text>
      <text x="645" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">MIN</text>
      <text x="705" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">MAX</text>
      <text x="765" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">ERROR %</text>
      <text x="845" y="21" fill="#aaaaaa" font-size="11" font-weight="bold">THROUGHPUT</text>

      <!-- Row 1: Home Page -->
      <rect y="34" width="960" height="36" fill="#2b2b2b" stroke="#3c3f41" stroke-width="0.5"/>
      <text x="12" y="56" fill="#3498db" font-size="11" font-weight="bold">HTTP 01 - Get Home Page</text>
      <text x="210" y="56" fill="#ffffff" font-size="11">250</text>
      <text x="290" y="56" fill="#2ecc71" font-size="11" font-weight="bold">198 ms</text>
      <text x="365" y="56" fill="#cccccc" font-size="11">185 ms</text>
      <text x="435" y="56" fill="#cccccc" font-size="11">240 ms</text>
      <text x="505" y="56" fill="#cccccc" font-size="11">265 ms</text>
      <text x="575" y="56" fill="#f1c40f" font-size="11">310 ms</text>
      <text x="645" y="56" fill="#cccccc" font-size="11">142 ms</text>
      <text x="705" y="56" fill="#cccccc" font-size="11">412 ms</text>
      <text x="765" y="56" fill="#2ecc71" font-size="11" font-weight="bold">0.00%</text>
      <text x="845" y="56" fill="#ffffff" font-size="11">11.2/sec</text>

      <!-- Row 2: Reserve Flight -->
      <rect y="72" width="960" height="36" fill="#313335" stroke="#3c3f41" stroke-width="0.5"/>
      <text x="12" y="94" fill="#3498db" font-size="11" font-weight="bold">HTTP 02 - Reserve Flight</text>
      <text x="210" y="94" fill="#ffffff" font-size="11">250</text>
      <text x="290" y="94" fill="#2ecc71" font-size="11" font-weight="bold">235 ms</text>
      <text x="365" y="94" fill="#cccccc" font-size="11">220 ms</text>
      <text x="435" y="94" fill="#cccccc" font-size="11">285 ms</text>
      <text x="505" y="94" fill="#cccccc" font-size="11">315 ms</text>
      <text x="575" y="94" fill="#f1c40f" font-size="11">375 ms</text>
      <text x="645" y="94" fill="#cccccc" font-size="11">168 ms</text>
      <text x="705" y="94" fill="#cccccc" font-size="11">520 ms</text>
      <text x="765" y="94" fill="#2ecc71" font-size="11" font-weight="bold">0.00%</text>
      <text x="845" y="94" fill="#ffffff" font-size="11">10.8/sec</text>

      <!-- Row 3: Select Flight -->
      <rect y="110" width="960" height="36" fill="#2b2b2b" stroke="#3c3f41" stroke-width="0.5"/>
      <text x="12" y="132" fill="#3498db" font-size="11" font-weight="bold">HTTP 03 - Select Flight</text>
      <text x="210" y="132" fill="#ffffff" font-size="11">250</text>
      <text x="290" y="132" fill="#2ecc71" font-size="11" font-weight="bold">248 ms</text>
      <text x="365" y="132" fill="#cccccc" font-size="11">232 ms</text>
      <text x="435" y="132" fill="#cccccc" font-size="11">295 ms</text>
      <text x="505" y="132" fill="#cccccc" font-size="11">330 ms</text>
      <text x="575" y="132" fill="#f1c40f" font-size="11">395 ms</text>
      <text x="645" y="132" fill="#cccccc" font-size="11">175 ms</text>
      <text x="705" y="132" fill="#cccccc" font-size="11">580 ms</text>
      <text x="765" y="132" fill="#2ecc71" font-size="11" font-weight="bold">0.00%</text>
      <text x="845" y="132" fill="#ffffff" font-size="11">10.6/sec</text>

      <!-- Row 4: Confirm Booking -->
      <rect y="148" width="960" height="36" fill="#313335" stroke="#3c3f41" stroke-width="0.5"/>
      <text x="12" y="170" fill="#3498db" font-size="11" font-weight="bold">HTTP 04 - Confirm Booking</text>
      <text x="210" y="170" fill="#ffffff" font-size="11">250</text>
      <text x="290" y="170" fill="#2ecc71" font-size="11" font-weight="bold">295 ms</text>
      <text x="365" y="170" fill="#cccccc" font-size="11">270 ms</text>
      <text x="435" y="170" fill="#cccccc" font-size="11">360 ms</text>
      <text x="505" y="170" fill="#cccccc" font-size="11">410 ms</text>
      <text x="575" y="170" fill="#f1c40f" font-size="11">485 ms</text>
      <text x="645" y="170" fill="#cccccc" font-size="11">195 ms</text>
      <text x="705" y="170" fill="#cccccc" font-size="11">645 ms</text>
      <text x="765" y="170" fill="#2ecc71" font-size="11" font-weight="bold">0.00%</text>
      <text x="845" y="170" fill="#ffffff" font-size="11">10.4/sec</text>

      <!-- Row 5: TOTAL (Summary Row) -->
      <rect y="186" width="960" height="42" fill="#1b2e24" stroke="#2ecc71" stroke-width="1"/>
      <text x="12" y="212" fill="#2ecc71" font-size="12" font-weight="bold">TOTAL (TOÀN BỘ HỆ THỐNG)</text>
      <text x="210" y="212" fill="#ffffff" font-size="12" font-weight="bold">1,000</text>
      <text x="290" y="212" fill="#2ecc71" font-size="12" font-weight="bold">244 ms</text>
      <text x="365" y="212" fill="#ffffff" font-size="12">227 ms</text>
      <text x="435" y="212" fill="#f1c40f" font-size="12" font-weight="bold">312 ms</text>
      <text x="505" y="212" fill="#ffffff" font-size="12">365 ms</text>
      <text x="575" y="212" fill="#ffffff" font-size="12">448 ms</text>
      <text x="645" y="212" fill="#cccccc" font-size="12">142 ms</text>
      <text x="705" y="212" fill="#cccccc" font-size="12">645 ms</text>
      <text x="765" y="212" fill="#2ecc71" font-size="12" font-weight="bold">0.00%</text>
      <text x="845" y="212" fill="#2ecc71" font-size="12" font-weight="bold">42.8/sec</text>
    </g>

    <!-- Analytical Evaluation Card -->
    <g transform="translate(0, 335)">
      <rect width="960" height="150" rx="4" fill="#242b35" stroke="#3498db" stroke-width="1"/>
      <text x="20" y="28" fill="#3498db" font-size="14" font-weight="bold">📊 PHÂN TÍCH VÀ ĐÁNH GIÁ CHỈ SỐ KỸ THUẬT (PERFORMANCE ANALYSIS):</text>
      
      <g transform="translate(20, 52)">
        <text x="0" y="0" fill="#ffffff" font-size="11">1. <tspan fill="#2ecc71" font-weight="bold">Thời gian đáp ứng (Response Time)</tspan>: Trung bình toàn bộ đạt <tspan fill="#2ecc71">244 ms</tspan>, thời gian lớn nhất <tspan fill="#f1c40f">645 ms</tspan>, hoàn toàn nằm trong ngưỡng SLA (&lt; 1500 ms).</text>
        <text x="0" y="24" fill="#ffffff" font-size="11">2. <tspan fill="#2ecc71" font-weight="bold">Độ ổn định phân vị (Percentiles)</tspan>: 90% lượng người dùng có độ trễ dưới <tspan fill="#f1c40f">312 ms</tspan> và 99% dưới <tspan fill="#f1c40f">448 ms</tspan>, chứng minh hệ thống không bị nghẽn cổ chai (Bottle-neck).</text>
        <text x="0" y="48" fill="#ffffff" font-size="11">3. <tspan fill="#2ecc71" font-weight="bold">Năng lực xử lý (Throughput)</tspan>: Hệ thống đáp ứng liên tục <tspan fill="#2ecc71">42.8 giao dịch/giây</tspan> ổn định trong suốt chu kỳ kiểm thử.</text>
        <text x="0" y="72" fill="#ffffff" font-size="11">4. <tspan fill="#2ecc71" font-weight="bold">Độ tin cậy (Reliability)</tspan>: Tỷ lệ lỗi <tspan fill="#2ecc71" font-weight="bold">Error Rate = 0.00%</tspan> (1,000/1,000 giao dịch xử lý thành công tuyệt đối, mã trạng thái HTTP 200).</text>
      </g>
    </g>
  </g>
</svg>
