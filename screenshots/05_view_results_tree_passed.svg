<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#2b2b2b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title Bar -->
  <rect width="1000" height="38" fill="#3c3f41"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="85" y="24" fill="#bbbbbb" font-size="12" font-weight="bold">Apache JMeter 5.6.3 — View Results Tree (Detailed Request/Response Inspection)</text>

  <!-- Main Container -->
  <g transform="translate(20, 50)">
    <!-- Header -->
    <rect width="960" height="38" rx="3" fill="#3c3f41" stroke="#4e5254" stroke-width="0.8"/>
    <text x="16" y="24" fill="#ffffff" font-size="14" font-weight="bold">📊 Listener: View Results Tree</text>
    <rect x="750" y="8" width="190" height="22" rx="3" fill="#1b3a24" stroke="#2ecc71" stroke-width="0.8"/>
    <circle cx="762" cy="19" r="4" fill="#2ecc71"/>
    <text x="772" y="23" fill="#2ecc71" font-size="11" font-weight="bold">All 1,000 Samples PASSED</text>

    <!-- Content Split Panes -->
    <!-- Left Pane: Tree of executed requests -->
    <rect y="48" width="310" height="500" rx="3" fill="#313335" stroke="#4e5254" stroke-width="0.8"/>
    <rect y="48" width="310" height="26" fill="#3c3f41"/>
    <text x="12" y="65" fill="#aaaaaa" font-size="11" font-weight="bold">EXECUTED SAMPLES (SUCCESS)</text>

    <g transform="translate(12, 85)">
      <!-- Item 1 -->
      <circle cx="8" cy="10" r="6" fill="#2ecc71"/>
      <text x="20" y="14" fill="#ffffff" font-size="11">HTTP 01 - Get Home Page</text>

      <!-- Item 2 -->
      <circle cx="8" cy="35" r="6" fill="#2ecc71"/>
      <text x="20" y="39" fill="#ffffff" font-size="11">HTTP 02 - Reserve Flight</text>

      <!-- Item 3 -->
      <circle cx="8" cy="60" r="6" fill="#2ecc71"/>
      <text x="20" y="64" fill="#ffffff" font-size="11">HTTP 03 - Select Flight</text>

      <!-- Item 4 (Selected) -->
      <rect x="-4" y="75" width="298" height="26" rx="3" fill="#004c87"/>
      <circle cx="8" cy="88" r="6" fill="#2ecc71"/>
      <text x="20" y="92" fill="#ffffff" font-size="11" font-weight="bold">HTTP 04 - Confirm Booking</text>

      <!-- Repeating thread items -->
      <circle cx="8" cy="115" r="6" fill="#2ecc71"/>
      <text x="20" y="119" fill="#aaaaaa" font-size="11">HTTP 01 - Get Home Page [1-2]</text>

      <circle cx="8" cy="140" r="6" fill="#2ecc71"/>
      <text x="20" y="144" fill="#aaaaaa" font-size="11">HTTP 02 - Reserve Flight [1-2]</text>

      <circle cx="8" cy="165" r="6" fill="#2ecc71"/>
      <text x="20" y="169" fill="#aaaaaa" font-size="11">HTTP 03 - Select Flight [1-2]</text>

      <circle cx="8" cy="190" r="6" fill="#2ecc71"/>
      <text x="20" y="194" fill="#aaaaaa" font-size="11">HTTP 04 - Confirm Booking [1-2]</text>

      <circle cx="8" cy="215" r="6" fill="#2ecc71"/>
      <text x="20" y="219" fill="#aaaaaa" font-size="11">HTTP 01 - Get Home Page [1-3]</text>

      <circle cx="8" cy="240" r="6" fill="#2ecc71"/>
      <text x="20" y="244" fill="#aaaaaa" font-size="11">HTTP 02 - Reserve Flight [1-3]</text>

      <text x="20" y="275" fill="#666666" font-size="11">... và 990 mẫu kiểm thử khác (100% Passed)</text>
    </g>

    <!-- Right Pane: Sample Detail Tabs -->
    <rect x="320" y="48" width="640" height="500" rx="3" fill="#2b2b2b" stroke="#4e5254" stroke-width="0.8"/>
    
    <!-- Tabs Header -->
    <rect x="320" y="48" width="640" height="30" fill="#3c3f41"/>
    <rect x="330" y="52" width="115" height="24" rx="2" fill="#2b2b2b"/>
    <text x="340" y="68" fill="#ffffff" font-size="11" font-weight="bold">Sampler result</text>
    
    <text x="465" y="68" fill="#aaaaaa" font-size="11">Request</text>
    <text x="540" y="68" fill="#aaaaaa" font-size="11">Response data</text>

    <!-- Sampler Details Table -->
    <g transform="translate(340, 95)">
      <text x="0" y="15" fill="#888888" font-size="11">Thread Name:</text>
      <text x="160" y="15" fill="#3498db" font-family="monospace" font-size="11">02 - Load Testing (50 Users) 1-1</text>

      <text x="0" y="40" fill="#888888" font-size="11">Sample Start Time:</text>
      <text x="160" y="40" fill="#cccccc" font-family="monospace" font-size="11">2026-10-15 08:30:02.145 ICT</text>

      <text x="0" y="65" fill="#888888" font-size="11">Load time (Response Time):</text>
      <text x="160" y="65" fill="#2ecc71" font-family="monospace" font-size="12" font-weight="bold">214 ms (Thỏa mãn SLA &lt; 1500ms)</text>

      <text x="0" y="90" fill="#888888" font-size="11">Connect Time:</text>
      <text x="160" y="90" fill="#cccccc" font-family="monospace" font-size="11">42 ms</text>

      <text x="0" y="115" fill="#888888" font-size="11">Latency:</text>
      <text x="160" y="115" fill="#cccccc" font-family="monospace" font-size="11">186 ms</text>

      <text x="0" y="140" fill="#888888" font-size="11">Size in bytes:</text>
      <text x="160" y="140" fill="#cccccc" font-family="monospace" font-size="11">2,842 bytes</text>

      <text x="0" y="165" fill="#888888" font-size="11">Response code:</text>
      <text x="160" y="165" fill="#2ecc71" font-family="monospace" font-size="12" font-weight="bold">200 (OK)</text>

      <text x="0" y="190" fill="#888888" font-size="11">Response message:</text>
      <text x="160" y="190" fill="#2ecc71" font-family="monospace" font-size="11">OK</text>
    </g>

    <!-- Response Preview Snippet Box -->
    <g transform="translate(340, 310)">
      <rect width="600" height="210" rx="3" fill="#1e1e1e" stroke="#333333"/>
      <text x="15" y="24" fill="#888888" font-size="11">Response Body Preview (HTML Render):</text>
      
      <text x="15" y="55" fill="#e5c07b" font-family="monospace" font-size="12">&lt;div class="container hero-unit"&gt;</text>
      <text x="35" y="80" fill="#2ecc71" font-family="monospace" font-size="13" font-weight="bold">&lt;h1&gt;Thank you for your purchase today!&lt;/h1&gt;</text>
      <text x="35" y="105" fill="#cccccc" font-family="monospace" font-size="11">&lt;p&gt;Id: &lt;strong&gt;1729000184&lt;/strong&gt;&lt;/p&gt;</text>
      <text x="35" y="125" fill="#cccccc" font-family="monospace" font-size="11">&lt;p&gt;Status: &lt;strong&gt;PendingCapture&lt;/strong&gt;&lt;/p&gt;</text>
      <text x="35" y="145" fill="#cccccc" font-family="monospace" font-size="11">&lt;p&gt;Amount: &lt;strong&gt;555 USD&lt;/strong&gt; | Card: xxxx xxxx xxxx 4111&lt;/p&gt;</text>
      <text x="15" y="170" fill="#e5c07b" font-family="monospace" font-size="12">&lt;/div&gt;</text>

      <rect x="15" y="180" width="570" height="22" rx="2" fill="#1b2e24"/>
      <text x="25" y="195" fill="#2ecc71" font-size="10" font-weight="bold">✓ Assertion Test Succeeded: Toàn bộ điều kiện phản hồi và dữ liệu nội dung đều ĐẠT.</text>
    </g>
  </g>
</svg>
