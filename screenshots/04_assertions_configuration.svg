<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#2b2b2b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title Bar -->
  <rect width="1000" height="38" fill="#3c3f41"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="85" y="24" fill="#bbbbbb" font-size="12" font-weight="bold">Apache JMeter 5.6.3 — Assertions Configuration (SLA &amp; Functional Validation)</text>

  <!-- Main Container -->
  <g transform="translate(30, 55)">
    <!-- Header -->
    <rect width="940" height="42" rx="4" fill="#3c3f41" stroke="#4e5254" stroke-width="0.8"/>
    <text x="20" y="27" fill="#2ecc71" font-size="15" font-weight="bold">✅ Assertions Configuration (Thiết lập Tiêu chí Đánh giá Chất lượng SLA)</text>

    <!-- Assertion 1: Response Code Assertion -->
    <g transform="translate(0, 55)">
      <rect width="940" height="205" rx="4" fill="#313335" stroke="#4e5254" stroke-width="0.8"/>
      
      <rect width="940" height="30" rx="4" fill="#2b2b2b"/>
      <text x="16" y="20" fill="#3498db" font-size="12" font-weight="bold">1. Response Assertion: Global Status Code 200 OK</text>

      <!-- Field to Test -->
      <text x="20" y="55" fill="#ffffff" font-size="12" font-weight="bold">Field to Test (Trường kiểm tra):</text>
      <circle cx="30" cy="78" r="4" fill="#2b2b2b" stroke="#888888"/>
      <text x="42" y="82" fill="#888888" font-size="11">Text Response</text>
      <circle cx="160" cy="78" r="4" fill="#3498db"/>
      <text x="172" y="82" fill="#2ecc71" font-size="11" font-weight="bold">Response Code (Mã HTTP)</text>
      <circle cx="330" cy="78" r="4" fill="#2b2b2b" stroke="#888888"/>
      <text x="342" y="82" fill="#888888" font-size="11">Response Message</text>
      <circle cx="480" cy="78" r="4" fill="#2b2b2b" stroke="#888888"/>
      <text x="492" y="82" fill="#888888" font-size="11">Response Headers</text>

      <!-- Pattern Matching Rules -->
      <text x="20" y="115" fill="#ffffff" font-size="12" font-weight="bold">Pattern Matching Rules (Quy tắc so khớp):</text>
      <circle cx="30" cy="138" r="4" fill="#2b2b2b" stroke="#888888"/>
      <text x="42" y="142" fill="#888888" font-size="11">Contains</text>
      <circle cx="130" cy="138" r="4" fill="#2b2b2b" stroke="#888888"/>
      <text x="142" y="142" fill="#888888" font-size="11">Matches</text>
      <circle cx="230" cy="138" r="4" fill="#3498db"/>
      <text x="242" y="142" fill="#2ecc71" font-size="11" font-weight="bold">Equals (Khớp chính xác)</text>
      <circle cx="400" cy="138" r="4" fill="#2b2b2b" stroke="#888888"/>
      <text x="412" y="142" fill="#888888" font-size="11">Substring</text>

      <!-- Patterns to Test -->
      <text x="20" y="172" fill="#ffffff" font-size="12" font-weight="bold">Patterns to Test:</text>
      <rect x="140" y="157" width="120" height="24" rx="2" fill="#2b2b2b" stroke="#2ecc71"/>
      <text x="180" y="173" fill="#2ecc71" font-size="12" font-family="monospace" font-weight="bold">200</text>
      <text x="280" y="173" fill="#888888" font-size="11">(Mọi request nếu server trả về 4xx, 5xx sẽ bị đánh dấu FAIL ngay lập tức)</text>
    </g>

    <!-- Assertion 2: Duration Assertion -->
    <g transform="translate(0, 275)">
      <rect width="940" height="120" rx="4" fill="#313335" stroke="#4e5254" stroke-width="0.8"/>
      <rect width="940" height="30" rx="4" fill="#2b2b2b"/>
      <text x="16" y="20" fill="#e67e22" font-size="12" font-weight="bold">2. Duration Assertion: Cam kết Thời gian Đáp ứng (SLA Latency Constraint)</text>

      <text x="20" y="60" fill="#ffffff" font-size="12" font-weight="bold">Duration in milliseconds (Thời gian tối đa cho phép):</text>
      <rect x="20" y="75" width="220" height="28" rx="2" fill="#2b2b2b" stroke="#f1c40f" stroke-width="1.2"/>
      <text x="35" y="94" fill="#f1c40f" font-size="13" font-family="monospace" font-weight="bold">1500</text>
      <text x="260" y="94" fill="#cccccc" font-size="11">ms (Nếu thời gian phản hồi vượt quá 1.5 giây = Vi phạm chỉ tiêu SLA của hệ thống)</text>
    </g>

    <!-- Assertion 3: Text Content Validation -->
    <g transform="translate(0, 410)">
      <rect width="940" height="115" rx="4" fill="#232e27" stroke="#2ecc71" stroke-width="1"/>
      <text x="20" y="25" fill="#2ecc71" font-size="13" font-weight="bold">3. Response Data Text Assertion (Kiểm tra nghiệp vụ thành công):</text>
      <text x="20" y="50" fill="#dddddd" font-size="11">• Trang chủ: Kiểm tra chuỗi <tspan fill="#3498db" font-family="monospace">"Welcome to the Simple Travel Agency!"</tspan></text>
      <text x="20" y="70" fill="#dddddd" font-size="11">• Trang tìm chuyến bay: Kiểm tra chuỗi <tspan fill="#3498db" font-family="monospace">"Flights from"</tspan></text>
      <text x="20" y="90" fill="#dddddd" font-size="11">• Trang xác nhận mua vé: Kiểm tra chuỗi <tspan fill="#2ecc71" font-family="monospace">"Thank you for your purchase today!"</tspan> (Đảm bảo giao dịch thực sự thành công trên máy chủ)</text>
    </g>
  </g>
</svg>
